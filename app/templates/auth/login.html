<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <header>
        <h3>To-Do List App</h3>
    </header>

    <section id="login-section" class="active">
        <fieldset>
            <legend id="inicio">Login</legend>

            {% if error %}
            <p class="error" style="color: red; font-weight: bold;">{{ error }}</p>
            {% endif %}


            <form action="/auth/login" method="POST">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required><br><br>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required><br><br>

                <button type="submit">Login</button>
            </form>
            <p>No account? <a href="{{ url_for('auth.register') }}">Register here</a></p>
            <a href="{{ url_for('oauth.login') }}" class="oauth-login">Login with Google</a>
        </fieldset>
    </section>

    <footer>
        <p>&copy; By Axel Ortega</p>
    </footer>
</body>
</html>
